# Verified against local codex-cli 0.166.0-alpha.5.1 and official documentation.
# Replace command with the absolute path to the packaged executable.
[mcp_servers.putty]
command = 'C:\PuTTY-AI\putty-ai-mcp.exe'
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 10
enabled_tools = ["list_sessions", "read_terminal", "acquire_control", "submit_command", "get_task_status", "cancel_task", "release_control"]
default_tools_approval_mode = "writes"

[mcp_servers.putty.tools.acquire_control]
approval_mode = "prompt"

[mcp_servers.putty.tools.submit_command]
approval_mode = "prompt"

[mcp_servers.putty.tools.cancel_task]
approval_mode = "prompt"

[mcp_servers.putty.tools.release_control]
approval_mode = "prompt"

